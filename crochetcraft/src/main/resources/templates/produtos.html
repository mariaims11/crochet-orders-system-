<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Produtos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<nav class="navbar">
  <a href="/">Home</a> |
  <a href="/categorias">Categorias</a> |
  <a href="/carrinho">Carrinho</a>
</nav>

<h1>Produtos</h1>

<hr>

<div class="produtos-container">

  <div class="produto-card"
       th:each="produto : ${produtos}">

    <img
            th:if="${produto.imagens != null and !produto.imagens.isEmpty()}"
            th:src="${produto.imagens[0].imagemUrl}"
            width="250"
            alt="Imagem do Produto">

    <h3 th:text="${produto.nome}"></h3>

    <p>
      Preço:
      <span th:text="${produto.preco}"></span> €
    </p>

    <a th:href="@{'/produtos/' + ${produto.idProduto}}">
      Ver produto
    </a>

    <br><br>

    <a th:href="@{'/carrinho/adicionar/' + ${produto.idProduto}}">
      Adicionar ao carrinho
    </a>

  </div>

</div>

</body>
</html>
