<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Carrinho</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<nav class="navbar">
  <a href="/">Home</a> |
  <a href="/produtos">Produtos</a> |
  <a href="/categorias">Categorias</a>
</nav>

<hr>

<h1>Carrinho</h1>

<div th:each="item : ${itens}">

  <h3 th:text="${item.produto.nome}"></h3>

  <p>

    <a th:href="@{'/carrinho/diminuir/' + ${item.produto.idProduto}}">
      -
    </a>

    <span th:text="${item.quantidade}"></span>

    <a th:href="@{'/carrinho/aumentar/' + ${item.produto.idProduto}}">
      +
    </a>

  </p>

  <p>Preço: <span th:text="${item.produto.preco}"></span> €</p>

  <a th:href="@{'/carrinho/remover/' + ${item.produto.idProduto}}">
    Remover
  </a>

  <hr>

</div>

<h2>Total: <span th:text="${total}"></span> €</h2>

<br>

<a href="/carrinho/limpar">Limpar carrinho</a>

<br><br>

<a href="/produtos">Continuar a comprar</a>

<br><br>
<a href="/checkout">
  Avançar para compra
</a>

</body>
</html>
